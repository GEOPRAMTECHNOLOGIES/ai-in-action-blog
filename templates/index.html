<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoPram AI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f6f7f9;color:#171717}.hero{min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(760px,100%);background:white;border:1px solid #e5e7eb;border-radius:28px;padding:42px;box-shadow:0 20px 60px #00000012;text-align:center}.logo{width:92px;height:92px;object-fit:contain;margin-bottom:20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:#666}.title{font-size:clamp(36px,7vw,70px);line-height:1.02;margin:15px 0}.sub{color:#666;font-size:18px}.button{margin-top:24px;border:0;border-radius:14px;padding:16px 24px;background:#0078d4;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.box{width:min(520px,100%);background:white;border-radius:22px;padding:28px;text-align:left}.box h2{margin-top:0}.field{display:block;margin:14px 0}.field span{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #bbb;border-radius:12px;font-size:16px}.terms{font-size:13px;color:#555}.summary{margin:18px 0;padding:14px;background:#f5f7fa;border-radius:12px;display:flex;justify-content:space-between}.error{margin:12px 0;padding:12px;border-radius:10px;background:#fff0f0;color:#a4262c;font-size:13px}.close{float:right;border:0;background:none;font-size:26px;cursor:pointer}.status{text-align:center;padding:25px 0}.small{font-size:12px;color:#777}
</style></head><body><main class="hero"><section class="card"><img class="logo" src="/static/geopram-ai-logo.png" onerror="this.style.display='none'"><div class="eyebrow">GEOPRAM TECHNOLOGIES</div><h1 class="title">The world is moving fast.<br>AI is accelerating it.</h1><p class="sub">Practical AI access from GeoPram Technologies.</p><button class="button" onclick="openPay()">SEE HOW →</button></section></main>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closePay()">×</button><div id="content"><h2>Get access</h2><p class="small">Complete the details below. You will receive an M-Pesa STK prompt.</p><label class="field"><span>Email</span><input id="email" type="email" placeholder="you@example.com"></label><label class="field"><span>M-Pesa phone</span><input id="phone" placeholder="0712345678"></label><label class="terms"><input id="terms" type="checkbox"> I agree to the access terms.</label><div class="summary"><span>Access</span><b>KES {{ amount }}</b></div><div id="error"></div><button class="button" style="width:100%" onclick="pay()">Continue to M-Pesa →</button></div></div></div>
<script>
let timer;function openPay(){document.getElementById('modal').style.display='flex'}function closePay(){document.getElementById('modal').style.display='none'}
async function pay(){const error=document.getElementById('error');error.innerHTML='';const email=document.getElementById('email').value.trim();const phone=document.getElementById('phone').value.trim();const terms=document.getElementById('terms').checked;if(!email||!email.includes('@')){error.innerHTML='<div class="error">Enter a valid email.</div>';return}if(!terms){error.innerHTML='<div class="error">Please accept the terms.</div>';return}error.innerHTML='<div class="status">Starting M-Pesa…</div>';let r=await fetch('/api/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,phone,termsAccepted:terms})});let d=await r.json();if(!r.ok){error.innerHTML='<div class="error">'+(d.error||'Payment could not be started.')+'</div>';return}document.getElementById('content').innerHTML='<div class="status"><h2>Check your phone</h2><p>'+ (d.message||'Approve the M-Pesa prompt.')+'</p><p class="small">Waiting for payment confirmation…</p><div id="wait"></div></div>';let n=0;timer=setInterval(async()=>{n++;let s=await fetch('/api/payment-status?id='+encodeURIComponent(d.paymentId));let x=await s.json();if(x.status==='SUCCESS'){clearInterval(timer);document.getElementById('content').innerHTML='<div class="status"><h2>Payment successful</h2><p>Your access code:</p><h2>'+x.accessCode+'</h2><p>Valid until '+new Date(x.expiresAt).toLocaleString()+'</p></div>'}else if(x.status==='FAILED'){clearInterval(timer);document.getElementById('content').innerHTML='<div class="error">Payment failed: '+(x.resultDesc||'Safaricom did not complete the payment.')+'</div>'}if(n>=60)clearInterval(timer)},3000)}
</script></body></html>
